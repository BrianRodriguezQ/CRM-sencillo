<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NAME@EMP" />
    <title>NAME@EMP — Delivery CRM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <script>
      // Aplica tema ANTES del bundle para evitar flash blanco/oscuro (anti-FOUC).
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('spi-theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
              (function () {
                var h = new Date().getHours()
                return h >= 19 || h < 7
              })()))
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
